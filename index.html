<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Translator</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#212529">
    <link rel="icon" type="image/png" sizes="32x32" href="/llm_translate-32x32.png">
    <link rel="apple-touch-icon" href="/llm_translate-180x180.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .toolbar-sticky {
            position: sticky;
            top: 0;
            z-index: 1050;
            background-color: var(--bs-body-bg);
            border-bottom: 1px solid var(--bs-border-color);
            padding: 0.75rem 0;
        }

        .pane-toolbar {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--bs-border-color);
        }

        .pane-textarea {
            width: 100%;
            min-height: 300px;
            resize: vertical;
            background-color: var(--bs-secondary-bg);
            border: 1px solid var(--bs-border-color);
            color: var(--bs-body-color);
            padding: 0.75rem;
            border-radius: 0.375rem;
        }

        .pane-textarea:focus {
            outline: none;
            border-color: var(--bs-primary);
            box-shadow: 0 0 0 0.25rem rgba(var(--bs-primary-rgb), 0.25);
        }

        .balance-display {
            font-family: monospace;
            font-size: 0.9rem;
        }

        .pane-content {
            padding: 0.5rem 0;
        }

        .text-justify {
            /* text-align: justify; */
        }

        .translation-source {
            font-size: 0.9rem;
        }

        .translation-target,
        .translation-explanation,
        .translation-nuances {
            font-size: 1rem;
        }


        .translation-source p,
        .translation-target p,
        .translation-literal p,
        .translation-explanation p,
        .translation-nuances p,
        .translation-interpretation p {
            margin: 0 0 0.3em;
            text-indent: 0.6em;
        }

        .translation-source p:last-child,
        .translation-target p:last-child,
        .translation-literal p:last-child,
        .translation-explanation p:last-child,
        .translation-nuances p:last-child,
        .translation-interpretation p:last-child {
            margin-bottom: 0;
        }

        .translation-target code,
        .translation-explanation code,
        .translation-nuances code {
            background: var(--bs-tertiary-bg);
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.85em;
        }

        .translation-target pre,
        .translation-explanation pre,
        .translation-nuances pre {
            background: var(--bs-tertiary-bg);
            padding: 0.5rem;
            border-radius: 0.375rem;
            overflow-x: auto;
        }

        .translation-target pre code,
        .translation-explanation pre code,
        .translation-nuances pre code {
            background: none;
            padding: 0;
        }

        .translation-target ul,
        .translation-explanation ul,
        .translation-nuances ul,
        .translation-target ol,
        .translation-explanation ol,
        .translation-nuances ol {
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
        }

        .translation-target blockquote,
        .translation-explanation blockquote,
        .translation-nuances blockquote {
            border-left: 3px solid var(--bs-border-color);
            padding-left: 0.75rem;
            margin-left: 0;
            color: var(--bs-secondary-color);
        }

        .answer-collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            position: relative;
        }

        .answer-collapsed::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1.5em;
            background: linear-gradient(transparent, var(--bs-body-bg));
        }

        .translation-section-tabs .nav-link {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
        }

        .translation-sections-area.translation-sections-collapsed .translation-sections-tabs-col {
            display: none;
        }

        .translation-sections-area.translation-sections-collapsed .translation-sections-content {
            display: none;
        }

        
        .translation-word {
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .translation-word:hover {
            background-color: var(--bs-info-border-subtle);
        }

        .translation-thinking {
            display: flex;
            flex-direction: column-reverse;
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            color: var(--bs-secondary-color);
            font-style: italic;
            border-bottom: 1px solid var(--bs-border-color);
            max-height: 200px;
            min-height: 0;
            overflow: hidden;
        }

        .thinking-content {
            margin-top: auto;
            margin-bottom: 0;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        .translation-item.output-item {
            border: 1px solid #375a7f;
        }
        .translation-item.output-item .translation-header {
            background: #1a2d47;
            color: var(--bs-secondary-color);
        }

        .translation-item.input-item {
            border: 1px solid #3a7a7f;
        }
        .translation-item.input-item .translation-header {
            background: #1a3336;
            color: var(--bs-secondary-color);
        }

        .translation-item.question-item {
            border: 1px solid #8a7f30;
        }
        .translation-item.question-item .translation-header {
            background: #2c2a24;
            color: var(--bs-secondary-color);
        }

        .translation-target table,
        .translation-source table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        .translation-target table th,
        .translation-source table th,
        .translation-target table td,
        .translation-source table td {
            padding: 0.5rem;
            border: 1px solid var(--bs-border-color);
        }

        .translation-target table tr:nth-child(even),
        .translation-source table tr:nth-child(even) {
            background-color: rgba(var(--bs-body-color-rgb), 0.03);
        }

        .conversation-wrapper {
            max-width: 46rem;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="toolbar-sticky">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <select class="form-select form-select-sm" id="session-selector" aria-label="Conversation selection">
                    </select>
                </div>
                <div class="col-auto text-end">
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="auth-btn" style="display: none;">Auth</button>
                </div>
                <div class="col-auto text-end">
                    <button type="button" class="btn btn-outline-secondary" id="config-button" title="Open configuration settings">
                        ⚙ 
                    </button>
                </div>
                <div class="col-auto text-end">
                    <span class="balance-display" id="balance-display" title="OpenRouter balance">--</span>
                </div>

            </div>
        </div>

        <!-- Error alert container -->
        <div id="error-container" class="container-fluid mt-2"></div>

        <!-- error-alert-template: Bootstrap alert for displaying errors -->
        <template id="error-alert-template">
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <span class="error-message"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </template>

        <!-- word-popup-template: Popup for showing word definitions on hover -->
        <template id="word-popup-template">
            <div class="word-popup" style="display: none; position: fixed; z-index: 1060; background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: 0.375rem; padding: 0.5rem 0.75rem; max-width: 300px; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);">
                <div class="word-popup-word" style="font-weight: bold; margin-bottom: 0.25rem;"></div>
                <div class="word-popup-def" style="margin-bottom: 0.25rem; font-size: 0.9rem;"></div>
                <div class="word-popup-exp" style="font-size: 0.85rem; color: var(--bs-secondary-color);"></div>
            </div>
        </template>

        <div class="conversation-wrapper">
            <main>
                <div class="tab-content row g-3 p-3">
                    <div class="col-12 mt-0" id="translation-pane">
                        <div class="translation-pane">
                            <div class="pane-content">
                                <textarea class="form-control form-control-sm mb-2" id="intent-textarea" rows="1" placeholder="Intent (e.g., be friendly, stern tone)..."></textarea>
                                <textarea class="pane-textarea" id="source-textarea" placeholder="Type text to translate..."></textarea>
                                <div class="pane-toolbar mt-2">
                                    <div class="row g-2 align-items-center">
                                        <div class="col-auto">
                                            <button type="button" class="btn btn-primary" id="translate-btn" disabled>
                                                Me
                                            </button>
                                            <button type="button" class="btn btn-secondary ms-1" id="ask-btn" disabled>
                                                Ask
                                            </button>
                                            <button type="button" class="btn btn-primary ms-1" id="input-btn" disabled>
                                                Them
                                            </button>
                                        </div>
                                        <div class="col">
                                            <select class="form-select form-select-sm ms-2" id="model-override" aria-label="Override model" style="width: auto;">
                                                <option value="">Default LLM</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div id="translations-container"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- translation-item-template: Template for displaying a translation pair -->
    <template id="translation-item-template">
        <div class="translation-item output-item" style="border-radius: 0.375rem; margin-bottom: 1rem; overflow: hidden;">
            <div class="row p-2 small translation-header">
                <div class="col-lg-2">
                    <span class="translation-prompt"></span>
                </div>
                <div class="col-lg-1">
                    <span class="translation-char-count"></span>
                </div>
                <div class="col text-end">
                    <span class="ms-2 translation-model-name"></span>
                    <button type="button" class="btn btn-sm btn-outline-danger stop-generation-btn ms-2" style="display: none;" title="Stop generation">⏹</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary delete-translation-btn ms-2" title="Delete message">✕</button>
                </div>
            </div>
            <div class="translation-edit-area px-3 py-2" style="display: none; background: var(--bs-tertiary-bg); border-bottom: 1px solid var(--bs-border-color);">
                <textarea class="form-control form-control-sm translation-edit-source mb-1" rows="5" placeholder="Edit text..."></textarea>
                <textarea class="form-control form-control-sm translation-edit-intent mb-1" rows="1" placeholder="Intent (e.g., be friendly, stern tone)..."></textarea>
                <button type="button" class="btn btn-sm btn-primary retranslate-btn">Retranslate</button>
            </div>
            <div class="row px-3">
                <div class="col text-justify translation-source p-2" style="border-bottom: 1px solid var(--bs-border-color);"></div>
                <div class="col-auto p-1 d-flex flex-column">
                    <button type="button" class="btn btn-sm btn-outline-secondary copy-source-btn" title="Copy to clipboard">📋</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary edit-toggle-btn mt-1" title="Edit">✏️</button>
                </div>
            </div>
            <div class="translation-thinking" style="display: none;">
                <div class="thinking-content"></div>
            </div>
            <div class="retranslation-tabs px-3 py-1" style="border-top: 1px solid var(--bs-border-color); border-bottom: 1px solid var(--bs-border-color);"></div>
            <div class="row px-3">
                <div class="col text-justify p-2">
                    <div class="translation-target"></div>
                    <div class="translation-spinner" style="display: none; padding: 1rem; text-align: center;">
                        <div class="spinner-border spinner-border-sm" role="status"></div>
                        <span style="margin-left: 0.5rem;">Translating...</span>
                    </div>
                </div>
                <div class="col-auto p-1">
                    <button type="button" class="btn btn-sm btn-outline-secondary copy-target-btn" title="Copy to clipboard">📋</button>
                </div>
            </div>
            <div class="translation-sections-area">
                <div class="row g-1 align-items-center px-3 py-1" style="border-top: 1px solid var(--bs-border-color);">
                    <div class="col translation-sections-tabs-col">
                        <ul class="nav nav-tabs translation-section-tabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button type="button" class="nav-link translation-section-tab active" id="literal-tab" data-bs-toggle="tab" data-bs-target="#literal-pane" role="tab" aria-controls="literal-pane" aria-selected="true">Literally</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button type="button" class="nav-link translation-section-tab" id="words-tab" data-bs-toggle="tab" data-bs-target="#words-pane" role="tab" aria-controls="words-pane" aria-selected="false">Words</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button type="button" class="nav-link translation-section-tab" id="explanation-tab" data-bs-toggle="tab" data-bs-target="#explanation-pane" role="tab" aria-controls="explanation-pane" aria-selected="false">Explanation</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button type="button" class="nav-link translation-section-tab" id="nuances-tab" data-bs-toggle="tab" data-bs-target="#nuances-pane" role="tab" aria-controls="nuances-pane" aria-selected="false">Nuances</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button type="button" class="nav-link translation-section-tab" id="interpretation-tab" data-bs-toggle="tab" data-bs-target="#interpretation-pane" role="tab" aria-controls="interpretation-pane" aria-selected="false">Interpretation</button>
                            </li>
                        </ul>
                    </div>
                    <div class="col-auto">
                        <button type="button" class="btn btn-sm btn-outline-secondary toggle-sections-btn" title="Toggle sections">▼</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary regenerate-literal-btn" style="display: none;">Regenerate</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary regenerate-interpretation-btn" style="display: none;">Regen</button>
                    </div>
                </div>
                <div class="tab-content translation-sections-content">
                    <div class="tab-pane fade show active" id="literal-pane" role="tabpanel" aria-labelledby="literal-tab">
                        <div class="translation-literal p-2 small text-justify"></div>
                    </div>
                    <div class="tab-pane fade" id="words-pane" role="tabpanel" aria-labelledby="words-tab">
                        <div class="translation-words p-2 small text-justify"></div>
                    </div>
                    <div class="tab-pane fade" id="explanation-pane" role="tabpanel" aria-labelledby="explanation-tab">
                        <div class="translation-explanation p-2 small text-justify"></div>
                    </div>
                    <div class="tab-pane fade" id="nuances-pane" role="tabpanel" aria-labelledby="nuances-tab">
                        <div class="translation-nuances p-2 small text-justify"></div>
                    </div>
                    <div class="tab-pane fade" id="interpretation-pane" role="tabpanel" aria-labelledby="interpretation-tab">
                        <div class="translation-interpretation p-2 small text-justify"></div>
                    </div>
                </div>
            </div>
            <div class="translation-error" style="display: none; padding: 0.75rem; background: var(--bs-danger-bg-subtle); color: var(--bs-danger);">
                <div class="d-flex align-items-center gap-2">
                    <div class="error-message flex-grow-1"></div>
                    <button type="button" class="btn btn-sm btn-outline-danger retry-btn">Retry</button>
                </div>
            </div>
        </div>
    </template>

    <!-- input-item-template: Template for displaying foreign text being translated (them) -->
    <template id="input-item-template">
        <div class="translation-item input-item" style="border-radius: 0.375rem; margin-bottom: 1rem; overflow: hidden;">
            <div class="row p-2 small translation-header">
                <div class="col-lg-2">
                    <span class="translation-prompt"></span>
                </div>
                <div class="col-lg-1">
                    <span class="translation-char-count"></span>
                </div>
                <div class="col text-end">
                    <span class="ms-2 translation-model-name"></span>
                    <button type="button" class="btn btn-sm btn-outline-danger stop-generation-btn ms-2" style="display: none;" title="Stop generation">⏹</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary delete-translation-btn ms-2" title="Delete message">✕</button>
                </div>
            </div>
            <div class="row px-3">
                <div class="col text-justify translation-source p-2" style="border-bottom: 1px solid var(--bs-border-color);"></div>
                <div class="col-auto p-1">
                    <button type="button" class="btn btn-sm btn-outline-secondary copy-source-btn" title="Copy to clipboard">📋</button>
                </div>
            </div>
            <div class="translation-thinking" style="display: none;">
                <div class="thinking-content"></div>
            </div>
            <div class="retranslation-tabs px-3 py-1" style="border-top: 1px solid var(--bs-border-color); border-bottom: 1px solid var(--bs-border-color);"></div>
            <div class="row px-3">
                <div class="col text-justify p-2">
                    <div class="translation-target"></div>
                    <div class="translation-spinner" style="display: none; padding: 1rem; text-align: center;">
                        <div class="spinner-border spinner-border-sm" role="status"></div>
                        <span style="margin-left: 0.5rem;">Translating...</span>
                    </div>
                </div>
                <div class="col-auto p-1 d-flex flex-column">
                    <button type="button" class="btn btn-sm btn-outline-secondary copy-target-btn" title="Copy to clipboard">📋</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary regenerate-translation-btn mt-1" title="Regenerate translation">↻</button>
                </div>
            </div>
            <div class="translation-sections-area">
                <div class="row g-1 align-items-center px-3 py-1" style="border-top: 1px solid var(--bs-border-color);">
                    <div class="col translation-sections-tabs-col">
                        <ul class="nav nav-tabs translation-section-tabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button type="button" class="nav-link translation-section-tab active" id="literal-tab" data-bs-toggle="tab" data-bs-target="#literal-pane" role="tab" aria-controls="literal-pane" aria-selected="true">Literally</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button type="button" class="nav-link translation-section-tab" id="words-tab" data-bs-toggle="tab" data-bs-target="#words-pane" role="tab" aria-controls="words-pane" aria-selected="false">Words</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button type="button" class="nav-link translation-section-tab" id="explanation-tab" data-bs-toggle="tab" data-bs-target="#explanation-pane" role="tab" aria-controls="explanation-pane" aria-selected="false">Explanation</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button type="button" class="nav-link translation-section-tab" id="nuances-tab" data-bs-toggle="tab" data-bs-target="#nuances-pane" role="tab" aria-controls="nuances-pane" aria-selected="false">Nuances</button>
                            </li>
                        </ul>
                    </div>
                    <div class="col-auto">
                        <button type="button" class="btn btn-sm btn-outline-secondary toggle-sections-btn" title="Toggle sections">▼</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary regenerate-literal-btn" style="display: none;">Regenerate</button>
                    </div>
                </div>
                <div class="tab-content translation-sections-content">
                    <div class="tab-pane fade show active" id="literal-pane" role="tabpanel" aria-labelledby="literal-tab">
                        <div class="translation-literal p-2 small text-justify"></div>
                    </div>
                    <div class="tab-pane fade" id="words-pane" role="tabpanel" aria-labelledby="words-tab">
                        <div class="translation-words p-2 small text-justify"></div>
                    </div>
                    <div class="tab-pane fade" id="explanation-pane" role="tabpanel" aria-labelledby="explanation-tab">
                        <div class="translation-explanation p-2 small text-justify"></div>
                    </div>
                    <div class="tab-pane fade" id="nuances-pane" role="tabpanel" aria-labelledby="nuances-tab">
                        <div class="translation-nuances p-2 small text-justify"></div>
                    </div>
                </div>
            </div>
            <div class="translation-error" style="display: none; padding: 0.75rem; background: var(--bs-danger-bg-subtle); color: var(--bs-danger);">
                <div class="d-flex align-items-center gap-2">
                    <div class="error-message flex-grow-1"></div>
                    <button type="button" class="btn btn-sm btn-outline-danger retry-btn">Retry</button>
                </div>
            </div>
        </div>
    </template>

    <!-- question-item-template: Template for displaying a question and answer -->
    <template id="question-item-template">
        <div class="translation-item question-item" style="border-radius: 0.375rem; margin-bottom: 1rem; overflow: hidden;">
            <div class="row p-2 small translation-header">
                <div class="col">
                    <span class="translation-prompt">Question</span>
                    <div class="form-check form-switch d-inline-block ms-2" style="font-size: 0.75rem; margin-bottom: 0; vertical-align: middle;">
                        <input class="form-check-input include-in-context-toggle" type="checkbox" role="switch">
                        <label class="form-check-label" style="font-size: 0.75rem;">Context</label>
                    </div>
                </div>
                <div class="col text-end">
                    <span class="ms-2 translation-model-name"></span>
                    <button type="button" class="btn btn-sm btn-outline-danger stop-generation-btn ms-2" style="display: none;" title="Stop generation">⏹</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary delete-translation-btn ms-2" title="Delete message">✕</button>
                </div>
            </div>
            <div class="row px-3">
                <div class="col text-justify translation-source p-2 fst-italic" style="border-bottom: 1px solid var(--bs-border-color);"></div>
                <div class="col-auto p-1 d-flex flex-column">
                    <button type="button" class="btn btn-sm btn-outline-secondary copy-source-btn" title="Copy to clipboard">📋</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary edit-toggle-btn mt-1" title="Edit">✏️</button>
                </div>
            </div>
            <div class="translation-edit-area px-3 py-2" style="display: none; background: var(--bs-tertiary-bg); border-bottom: 1px solid var(--bs-border-color);">
                <textarea class="form-control form-control-sm translation-edit-source mb-1" rows="5" placeholder="Edit question..."></textarea>
                <button type="button" class="btn btn-sm btn-primary retranslate-btn">Regenerate</button>
            </div>
            <div class="translation-thinking" style="display: none;">
                <div class="thinking-content"></div>
            </div>
            <div class="row px-3">
                <div class="col text-justify p-2">
                    <div class="translation-target"></div>
                    <div class="translation-spinner" style="display: none; padding: 1rem; text-align: center;">
                        <div class="spinner-border spinner-border-sm" role="status"></div>
                        <span style="margin-left: 0.5rem;">Translating...</span>
                    </div>
                </div>
                <div class="col-auto p-1 d-flex flex-column">
                    <button type="button" class="btn btn-sm btn-outline-secondary toggle-answer-btn" title="Toggle answer">▼</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary regenerate-answer-btn mt-1" style="display: none;" title="Regenerate answer">↻</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary copy-answer-btn mt-1" style="display: none;" title="Copy answer">📋</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary save-answer-btn mt-1" style="display: none;" title="Save answer">💾</button>
                </div>
            </div>
            <div class="translation-error" style="display: none; padding: 0.75rem; background: var(--bs-danger-bg-subtle); color: var(--bs-danger);">
                <div class="d-flex align-items-center gap-2">
                    <div class="error-message flex-grow-1"></div>
                    <button type="button" class="btn btn-sm btn-outline-danger retry-btn">Retry</button>
                </div>
            </div>
        </div>
    </template>

    <!-- settings-modal-template: Large modal for application settings -->
    <template id="settings-modal-template">
        <div class="modal fade" tabindex="-1" aria-labelledby="settings-modal-title">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="settings-modal-title">Settings</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <ul class="nav nav-tabs mb-3" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button type="button" class="nav-link active" id="settings-tab-btn" data-bs-toggle="tab" data-bs-target="#settings-content" role="tab" aria-controls="settings-content" aria-selected="true">Settings</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button type="button" class="nav-link" id="conversations-tab-btn" data-bs-toggle="tab" data-bs-target="#conversations-content" role="tab" aria-controls="conversations-content" aria-selected="false">Conversations</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button type="button" class="nav-link" id="models-tab-btn" data-bs-toggle="tab" data-bs-target="#models-content" role="tab" aria-controls="models-content" aria-selected="false">Models</button>
                            </li>
                        </ul>
                        <div class="tab-content" id="settings-tab-content">
                            <div class="tab-pane fade show active" id="settings-content" role="tabpanel" aria-labelledby="settings-tab-btn">
                                <h6>OpenRouter API Key</h6>
                                <div class="mb-3">
                                    <div class="input-group">
                                        <input type="password" id="settings-api-key" class="form-control" 
                                               placeholder="Enter your OpenRouter API key"
                                               title="Your OpenRouter API key for accessing translation models">
                                        <button type="button" class="btn btn-outline-secondary" 
                                                id="settings-toggle-key-visibility" 
                                                title="Show or hide the API key"
                                                aria-label="Toggle API key visibility">👁</button>
                                    </div>
                                </div>
                                <hr>
                                <h6>Model Price Filter ($ per million tokens)</h6>
                                <div class="row g-2 mb-4">
                                    <div class="col">
                                        <label for="settings-min-price" class="form-label">Min Price</label>
                                        <input type="number" id="settings-min-price" class="form-control" min="0" step="0.01" placeholder="0.00">
                                    </div>
                                    <div class="col">
                                        <label for="settings-max-price" class="form-label">Max Price</label>
                                        <input type="number" id="settings-max-price" class="form-control" min="0" step="0.01" placeholder="No limit">
                                    </div>
                                </div>
                                <div class="row g-2 mb-4">
                                    <div class="col">
                                        <label for="settings-temperature" class="form-label">Temperature</label>
                                        <input type="number" id="settings-temperature" class="form-control" min="0" max="2" step="0.1" placeholder="0.2">
                                    </div>
                                    <div class="col">
                                        <label for="settings-question-temperature" class="form-label">Question Temperature</label>
                                        <input type="number" id="settings-question-temperature" class="form-control" min="0" max="2" step="0.1" placeholder="0.35">
                                    </div>
                                    <div class="col">
                                        <label for="settings-max-tokens" class="form-label">Max Tokens (K)</label>
                                        <input type="number" id="settings-max-tokens" class="form-control" min="1" max="1024" step="1" value="32">
                                    </div>
                                    <div class="col">
                                        <label for="settings-default-my-language" class="form-label">Default My Language</label>
                                        <select id="settings-default-my-language" class="form-select"></select>
                                    </div>
                                </div>
                                <hr>
                                <h6>New Conversation Defaults</h6>
                                <div class="row g-2 mb-2">
                                    <div class="col">
                                        <label for="settings-default-model" class="form-label">Translation Model</label>
                                        <select id="settings-default-model" class="form-select"></select>
                                    </div>
                                    <div class="col-lg-2">
                                        <label for="settings-default-reasoning" class="form-label">Reasoning</label>
                                        <select id="settings-default-reasoning" class="form-select" title="Controls how much reasoning the model does before responding">
                                            <option value="none">None</option>
                                            <option value="minimal">Minimal</option>
                                            <option value="low">Low</option>
                                            <option value="medium">Medium</option>
                                            <option value="high">High</option>
                                            <option value="xhigh">Max</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-12 mb-2">
                                    <label for="settings-default-literal-model" class="form-label">Literal Model</label>
                                    <select id="settings-default-literal-model" class="form-select"></select>
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col">
                                        <label for="settings-default-interpretation-model" class="form-label">Interpretation Model</label>
                                        <select id="settings-default-interpretation-model" class="form-select"></select>
                                    </div>
                                    <div class="col-lg-2">
                                        <label for="settings-default-interpretation-reasoning" class="form-label">Reasoning</label>
                                        <select id="settings-default-interpretation-reasoning" class="form-select">
                                            <option value="none">None</option>
                                            <option value="minimal">Minimal</option>
                                            <option value="low">Low</option>
                                            <option value="medium">Medium</option>
                                            <option value="high">High</option>
                                            <option value="xhigh">Max</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="conversations-content" role="tabpanel" aria-labelledby="conversations-tab-btn">
                                <div class="row g-2 mt-3">
                                    <div class="col-12">
                                        <label for="settings-session-list" class="form-label">Conversation</label>
                                        <div class="row g-2">
                                            <div class="col">
                                                <select id="settings-session-list" class="form-select">
                                                </select>
                                            </div>
                                            <div class="col-auto">
                                                <button type="button" class="btn btn-outline-danger" id="settings-delete-session-btn" disabled title="Delete this conversation">Delete</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="row g-2">
                                            <div class="col">
                                                <label for="settings-session-name" class="form-label">Conversation Name</label>
                                                <input type="text" id="settings-session-name" class="form-control" placeholder="Enter conversation name">
                                            </div>
                                            <div class="col">
                                                <label for="settings-session-interlocutor-name" class="form-label">Interlocutor Name</label>
                                                <input type="text" id="settings-session-interlocutor-name" class="form-control" placeholder="Name of the person you're talking to">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="row g-2">
                                            <div class="col">
                                                <label for="settings-session-model" class="form-label">Translation Model</label>
                                                <select id="settings-session-model" class="form-select">
                                                </select>
                                            </div>
                                            <div class="col-lg-2">
                                                <label for="settings-session-reasoning" class="form-label">Reasoning</label>
                                                <select id="settings-session-reasoning" class="form-select"
                                                        title="Controls how much reasoning the model does before responding">
                                                    <option value="none">None</option>
                                                    <option value="minimal">Minimal</option>
                                                    <option value="low">Low</option>
                                                    <option value="medium">Medium</option>
                                                    <option value="high">High</option>
                                                    <option value="xhigh">Max</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <label for="settings-session-literal-model" class="form-label">Literal Model</label>
                                        <select id="settings-session-literal-model" class="form-select">
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <div class="row g-2">
                                            <div class="col">
                                                <label for="settings-session-interpretation-model" class="form-label">Interpretation Model</label>
                                                <select id="settings-session-interpretation-model" class="form-select">
                                                </select>
                                            </div>
                                            <div class="col-lg-2">
                                                <label for="settings-session-interpretation-reasoning" class="form-label">Reasoning</label>
                                                <select id="settings-session-interpretation-reasoning" class="form-select">
                                                    <option value="none">None</option>
                                                    <option value="minimal">Minimal</option>
                                                    <option value="low">Low</option>
                                                    <option value="medium">Medium</option>
                                                    <option value="high">High</option>
                                                    <option value="xhigh">Max</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="row g-2">
                                            <div class="col">
                                                <label for="settings-session-my-language" class="form-label">My Language</label>
                                                <select id="settings-session-my-language" class="form-select"></select>
                                            </div>
                                            <div class="col">
                                                <label for="settings-session-their-language" class="form-label">Their Language</label>
                                                <select id="settings-session-their-language" class="form-select"></select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <label for="settings-session-background" class="form-label">Background</label>
                                        <textarea id="settings-session-background" class="form-control" rows="5" placeholder="Context for the AI about who you're talking to, what the conversation is about, etc."></textarea>
                                    </div>
                                    <div class="col-12">
                                        <label for="settings-session-translation-instructions" class="form-label">Translation Instructions</label>
                                        <textarea id="settings-session-translation-instructions" class="form-control" rows="5" placeholder="General instructions for how translations should be styled and presented (e.g. tone, formality, register). Leave empty for default."></textarea>
                                    </div>
                                    <div class="col-12">
                                        <button type="button" class="btn btn-sm btn-primary" id="settings-save-session-btn">Save</button>
                                    </div>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="models-content" role="tabpanel" aria-labelledby="models-tab-btn">
                                <h6>Approved Models</h6>
                                <p class="text-muted small mb-3">Only approved models appear in model selectors.</p>
                                <div class="input-group input-group-sm mb-2">
                                    <input type="text" id="settings-models-search" class="form-control" placeholder="Filter models...">
                                    <button class="btn btn-outline-secondary" type="button" id="settings-models-search-clear" title="Clear filter">✕</button>
                                </div>
                                <div class="mb-2">
                                    <button type="button" class="btn btn-sm btn-outline-primary" id="settings-select-all-models">Select All</button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary" id="settings-deselect-all-models">Deselect All</button>
                                </div>
                                <div id="settings-models-list" style="max-height: 400px; overflow-y: auto; border: 1px solid var(--bs-border-color); border-radius: 0.375rem; padding: 0.5rem;">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="settings-save-btn">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- auth-modal-template: Bootstrap modal for Clerk sign-in/sign-up -->
    <template id="auth-modal-template">
        <div class="modal fade" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-sm modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body" id="auth-modal-body"></div>
                </div>
            </div>
        </div>
    </template>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
    <script src="/clerk-key.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
